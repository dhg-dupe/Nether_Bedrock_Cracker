name: Build Windows exe

on:
  workflow_dispatch:
  push:

jobs:
  windows:
    runs-on: windows-latest
    env:
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release --package cracker_gui
      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: BedrockCracker_NoLimit
          path: target/release/cracker_gui.exe
